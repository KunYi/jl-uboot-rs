[workspace]
members = [
    "crates/jl-sg",
    "crates/jl-msc",
    "crates/jl-uboot",
    "crates/jl-device-db",
    "apps/jluboot",
    "apps/jlrunner",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
authors = ["KunYi Chen"]

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "2"
libc = "0.2"
serde_json = "1"
tempfile = "3"
